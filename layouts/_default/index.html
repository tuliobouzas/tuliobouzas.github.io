{{ define "main" }}
    
    <!-- Profile picture -->
    <img class="profile" src="/img/profile.avif" alt="Profile Picture">
    <!-- Click to swap to suit picture (disabled)
    <img class="profile" src="/img/profile.avif" alt="Profile Picture" style="cursor: pointer; transition: transform 0.3s;"
    onclick="this.src = (this.src.indexOf('profile.avif') !== -1) ? '/img/profile-suit.avif' : '/img/profile.avif';">
    -->

    <!-- Text -->
    <div class="info-home">
        {{ .Content }}
    </div>

    <!-- Contact row -->
    <div class="contact-row">
        <div>
            <em>Contact info:</em><br>
            <a href="mailto:{{ .Params.email }}">{{ .Params.email }}</a>
        </div>
        <div>
            <em>Curriculum Vitae:</em><br>
            <a href="{{ .Params.cv }}">Download</a>
        </div>
        <div>
            <em>Office</em><br>
            {{ .Params.office }}
        </div>
    </div>
{{ end }}
